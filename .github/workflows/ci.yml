name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Test vectors are reproducible
        run: |
          python tools/generate_bip_vectors.py
          git diff --exit-code docs/bip/0001-test-vectors.json
      - name: CLI smoke test
        run: |
          safe-btc info
          python examples/generate_pq_address.py
