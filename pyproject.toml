[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-btc"
version = "0.1.0"
description = "Quantum-resistant address formats and tools for Bitcoin"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Zaenus", email = "zaenus@users.noreply.github.com"}]
keywords = ["bitcoin", "quantum", "post-quantum", "ml-dsa", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pqcrypto>=1.0.0",
]

[project.scripts]
safe-btc = "safe_btc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["safe_btc*"]
